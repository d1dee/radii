name: radii

services:
    radii:
        build:
            context: .
            dockerfile: deploy/Dockerfile
        image: radii:latest
        restart: unless-stopped
        stop_grace_period: 30s
        env_file:
            - path: ${RADII_ENV_FILE:-.env}
              format: raw
        environment:
            SERVER_ADDRESS: 0.0.0.0
            SERVER_PORT: '8080'
            WG_IFACE: wg0
            WG_MANAGE_PEERS: 'true'
            WG_USE_SUDO: 'false'
            RADIUS_CONFIG_DIR: /etc/raddb
        cap_add:
            - NET_ADMIN
        ports:
            # RADIUS is reached through WireGuard; HTTP is reached through Caddy.
            - '${WG_PUBLIC_PORT:-51820}:51820/udp'
        expose:
            - '8080'
            - '8081'
            - '8082'
            - '8083'
        volumes:
            # Existing certificates are supplied by raddb/certs; do not hide them.
            - type: bind
              source: ${RADIUS_CONFIG_PATH:-/home/radii/raddb}
              target: /etc/raddb
              read_only: true
              bind:
                  create_host_path: false
                  selinux: Z
            - type: bind
              source: ${WIREGUARD_CONFIG_PATH:-/home/radii/wireguard}
              target: /etc/wireguard
              read_only: true
              bind:
                  create_host_path: false
                  selinux: Z
        logging:
            driver: journald
            options:
                tag: radii
