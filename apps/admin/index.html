<!doctype html>
<html lang="en" style="overflow: hidden">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin</title>
        <script>
            (() => {
                let scheme;
                try {
                    scheme = localStorage.getItem('mantine-color-scheme-value');
                } catch {}
                const dark = scheme === 'dark' ||
                    (scheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.mantineColorScheme = dark ? 'dark' : 'light';
            })();
        </script>
        <style>
            :root { color-scheme: light; background: #f5f7fa; }
            :root[data-mantine-color-scheme='dark'] { color-scheme: dark; background: #1a1b1e; }
            body { margin: 0; }
            .admin-loading {
                display: grid;
                place-items: center;
                min-height: 12rem;
                color: #596579;
                font: 400 0.875rem/1.5 system-ui, sans-serif;
            }
            [data-mantine-color-scheme='dark'] .admin-loading { color: #909296; }
            .admin-loading-full { min-height: 100dvh; }
            .resource-loader-stage {
                display: grid;
                place-items: center;
                width: 100%;
                min-height: 32px;
            }
            .resource-loader {
                width: 40px;
                height: 20px;
                --loader-dot: no-repeat radial-gradient(farthest-side, currentColor 93%, transparent);
                background: var(--loader-dot) 0 0, var(--loader-dot) 50% 0;
                background-size: 8px 8px;
                position: relative;
                clip-path: inset(-200% -100% 0 0);
                animation: resource-loader-dots 1.5s linear infinite;
                transform: scale(1.3);
                transform-origin: center;
            }
            .resource-loader::before {
                content: '';
                position: absolute;
                width: 8px;
                height: 12px;
                background: currentColor;
                left: -16px;
                top: 0;
                animation: resource-loader-jump 1.5s linear infinite, resource-loader-squash 0.5s cubic-bezier(0, 200, 0.8, 200) infinite;
            }
            .resource-loader::after {
                content: '';
                position: absolute;
                inset: 0 0 auto auto;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: currentColor;
                animation: resource-loader-roll 1.5s linear infinite;
            }
            .resource-loader-label {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }
            @keyframes resource-loader-dots {
                0%, 30% { background-position: 0 0, 50% 0; }
                33% { background-position: 0 100%, 50% 0; }
                41%, 63% { background-position: 0 0, 50% 0; }
                66% { background-position: 0 0, 50% 100%; }
                74%, 100% { background-position: 0 0, 50% 0; }
            }
            @keyframes resource-loader-jump {
                90% { transform: translateY(0); }
                95% { transform: translateY(15px); }
                100% { transform: translateY(15px); left: calc(100% - 8px); }
            }
            @keyframes resource-loader-squash { 100% { top: -0.1px; } }
            @keyframes resource-loader-roll {
                0%, 80%, 100% { transform: translate(0); }
                90% { transform: translate(26px); }
            }
            @media (prefers-reduced-motion: reduce) {
                .resource-loader, .resource-loader::before, .resource-loader::after { animation: none; }
            }
        </style>
    </head>
    <body style="overflow: hidden">
        <div id="root">
            <div class="admin-loading admin-loading-full" role="status">
                <div class="resource-loader-stage" aria-hidden="true"><div class="resource-loader"></div></div>
                <span class="resource-loader-label">Loading admin console...</span>
            </div>
        </div>
        <noscript>
            <style>.admin-loading { display: none; }</style>
            <p>JavaScript is required to use the admin console.</p>
        </noscript>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
