<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script data-mantine-script>
      try {
        var storedColorScheme = window.localStorage.getItem('mantine-color-scheme-value');
        var colorScheme =
          storedColorScheme === 'light' ||
          storedColorScheme === 'dark' ||
          storedColorScheme === 'auto'
            ? storedColorScheme
            : 'auto';
        var computedColorScheme =
          colorScheme !== 'auto'
            ? colorScheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute(
          'data-mantine-color-scheme',
          computedColorScheme,
        );
      } catch (error) {}
    </script>
    <title>PPPoE</title>
    <style>
      html { background: #fff; color: #242424; }
      html[data-mantine-color-scheme='dark'] { background: #242424; color: #c9c9c9; }
      .portal-startup { box-sizing: border-box; max-width: 36rem; margin: 1rem auto; padding: 1.5rem; border: 1px solid #8885; border-radius: 1rem; font: 1rem/1.5 system-ui, sans-serif; min-height: 12rem; }
      .portal-startup h1 { margin: 0 0 1rem; font-size: 1.25rem; }
    </style>
  </head>
  <body>
    <div id="root"><main class="portal-startup" aria-busy="true"><h1>PPPoE portal</h1><p role="status">Loading your account and available packages...</p><noscript>Enable JavaScript to sign in and manage your connection.</noscript></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
